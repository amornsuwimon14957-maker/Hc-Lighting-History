<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blurred Office Background Example</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      position: relative;
      overflow-x: hidden;
    }

    /* ฉากหลัง + Overlay ช่วยลดความรำคาญตา */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      /* ใส่ภาพฉากหลังซ้อนกับ Gradient ดำใส (Dark Overlay) */
      background-image: 
        linear-gradient(rgba(15, 23, 42, 0.65), rgba(15, 23, 42, 0.65)),
        url('https://i.postimg.cc/52SK4Mht/blurred-empty-open-space-office-abstract-light-bokeh-office-interior-background-1028938-486600.avif');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      /* ปรับแต่งภาพเพิ่มเติมให้ดูนุ่มตาขึ้น */
      filter: brightness(0.85) contrast(0.95);
    }

    /* กล่องเนื้อหาหลัก (การ์ดใสแบบ Glassmorphism สบายตา) */
    .content-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 2.5rem;
      border-radius: 16px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .content-box h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .content-box p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>

  <!-- ฉากหลัง -->
  <div class="bg-container"></div>

  <!-- กล่องแสดงข้อความ/เนื้อหา -->
  <div class="content-box">
    <h1>ยินดีต้อนรับ</h1>
    <p>นี่คือตัวอย่างการใส่ฉากหลังรูปออฟฟิศแบบไม่รำคาญตา โดยใช้เงาดำทับฉากหลัง (Overlay) ช่วยเพิ่มความโดดเด่นให้อ่านข้อความง่ายยิ่งขึ้น</p>
  </div>

</body>
</html>
