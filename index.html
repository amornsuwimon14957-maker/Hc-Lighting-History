<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกประวัติเปลี่ยนหลอดไฟ</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-4">
    <h1 class="text-xl font-bold text-center text-indigo-600">🔧 ระบบบันทึกประวัติเปลี่ยนหลอดไฟ</h1>

    <!-- ส่วนแสดงผู้ใช้งาน -->
    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-lg border border-slate-200">
      <span id="user-display" class="text-sm font-medium text-slate-700">กำลังโหลดผู้ใช้งาน...</span>
      <button onclick="changeUser()" class="text-xs text-indigo-500 hover:underline">เปลี่ยนชื่อ</button>
    </div>

    <!-- ฟอร์มบันทึกงาน -->
    <form id="job-form" onsubmit="saveJob(event)" class="space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">อาคาร / โซน</label>
        <input type="text" id="building-input" required class="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="เช่น อาคาร A">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ห้อง / บริเวณ</label>
        <input type="text" id="room-input" required class="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="เช่น ห้อง 101">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">จุดหลอดไฟ / โคมที่</label>
        <input type="text" id="lightNo-input" required class="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="เช่น จุดที่ 3">
      </div>

      <!-- รายการอุปกรณ์ -->
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">รายการอุปกรณ์ที่เปลี่ยน</label>
        <div id="items-container" class="space-y-2">
          <div class="flex gap-2">
            <input type="text" class="item-name w-2/3 border border-slate-300 rounded-lg p-2 text-sm" placeholder="ชื่ออุปกรณ์" required>
            <input type="number" class="item-qty w-1/3 border border-slate-300 rounded-lg p-2 text-sm" value="1" min="1" required>
          </div>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อช่างผู้เปลี่ยน</label>
        <input type="text" id="technician-name" required class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50" readonly>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">หมายเหตุ (ถ้ามี)</label>
        <input type="text" id="job-note" class="w-full border border-slate-300 rounded-lg p-2 text-sm" placeholder="ระบุเพิ่มเติม...">
      </div>

      <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition">
        บันทึกข้อมูล
      </button>
    </form>

    <hr class="my-4">

    <!-- ส่วนแสดงประวัติ -->
    <div>
      <h2 class="font-bold text-slate-700 mb-2">📜 ประวัติการเปลี่ยนหลอดไฟ (เซิร์ฟเวอร์กลาง)</h2>
      <div id="history-list" class="space-y-2 max-h-64 overflow-y-auto">
        <div class="text-center text-slate-400 py-4">กำลังโหลดประวัติ...</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://sheetdb.io/api/v1/5by4qw8r0d60v";
    let currentUser = localStorage.getItem('hc_current_user') || '';

    // เช็คชื่อผู้ใช้ตอนเข้าเว็บ
    function checkLogin() {
      if (!currentUser) {
        currentUser = prompt('กรุณากรอกชื่อช่างของคุณ (เพื่อใช้บันทึกประวัติ):') || 'ไม่ระบุชื่อ';
        localStorage.setItem('hc_current_user', currentUser);
      }
      document.getElementById('user-display').innerText = `ผู้ใช้งาน: ${currentUser}`;
      document.getElementById('technician-name').value = currentUser;
    }

    function changeUser() {
      currentUser = prompt('เปลี่ยนชื่อผู้ใช้งาน:', currentUser) || currentUser;
      localStorage.setItem('hc_current_user', currentUser);
      document.getElementById('user-display').innerText = `ผู้ใช้งาน: ${currentUser}`;
      document.getElementById('technician-name').value = currentUser;
    }

    // --- 1. ฟังก์ชันบันทึกข้อมูลลง SheetDB กลาง ---
    async function saveJob(e) {
      e.preventDefault();

      const building = document.getElementById('building-input').value.trim();
      const room = document.getElementById('room-input').value.trim();
      const lightNo = document.getElementById('lightNo-input').value.trim();
      const note = document.getElementById('job-note').value.trim() || '-';

      const itemRows = document.querySelectorAll('#items-container > div');
      const itemsList = [];

      itemRows.forEach(row => {
        const name = row.querySelector('.item-name').value.trim();
        const qty = parseInt(row.querySelector('.item-qty').value) || 1;
        if (name) itemsList.push(`${name} (${qty} ชิ้น)`);
      });

      const record = {
        id: Date.now().toString(),
        date: new Date().toLocaleString('th-TH'),
        building: building,
        room: room,
        lightNo: lightNo,
        technician: currentUser,
        items: itemsList.join(', '),
        note: note
      };

      try {
        alert('กำลังบันทึกข้อมูลลงเซิร์ฟเวอร์กลาง...');
        
        await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ data: [record] })
        });

        alert('บันทึกการเปลี่ยนหลอดไฟเรียบร้อยแล้ว!');
        document.getElementById('job-form').reset();
        document.getElementById('technician-name').value = currentUser;
        renderHistory(); // โหลดประวัติใหม่ทันที
      } catch (error) {
        console.error(error);
        alert('เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่อีกครั้ง');
      }
    }

    // --- 2. ฟังก์ชันดึงประวัติจาก SheetDB มาแสดงผลรวมทุกเครื่อง ---
    async function renderHistory() {
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = '<div class="text-center text-slate-400 py-4">กำลังโหลดประวัติ...</div>';

      try {
        const response = await fetch(API_URL);
        const history = await response.json();

        if (!Array.isArray(history) || history.length === 0) {
          historyList.innerHTML = '<div class="text-center text-slate-400 py-8">ยังไม่มีประวัติการเปลี่ยนหลอดไฟ</div>';
          return;
        }

        // เรียงจากล่าสุดไปเก่าสุด
        history.reverse();

        historyList.innerHTML = history.map(item => `
          <div class="bg-slate-50 border border-slate-200 rounded-lg p-3 space-y-1 text-sm">
            <div class="flex justify-between items-start text-indigo-600 font-semibold">
              <span>${item.building || '-'} > ${item.room || '-'} [${item.lightNo || '-'}]</span>
              <span class="text-xs text-slate-400">${item.date || '-'}</span>
            </div>
            <div class="text-slate-800 font-medium">🔧 อุปกรณ์: ${item.items || '-'}</div>
            <div class="text-slate-500 text-xs flex justify-between">
              <span>ผู้เปลี่ยน: ${item.technician || '-'}</span>
              ${item.note && item.note !== '-' ? `<span class="italic text-slate-400">หมายเหตุ: ${item.note}</span>` : ''}
            </div>
          </div>
        `).join('');

      } catch (error) {
        console.error(error);
        historyList.innerHTML = '<div class="text-center text-red-400 py-4">ไม่สามารถโหลดประวัติจากเซิร์ฟเวอร์ได้</div>';
      }
    }

    // เริ่มทำงานเมื่อเปิดเว็บ
    window.onload = function() {
      checkLogin();
      renderHistory();
    };
  </script>
</body>
</html>
